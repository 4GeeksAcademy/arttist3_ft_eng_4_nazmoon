<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="studio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0eb"/>
      <stop offset="60%" stop-color="#e8e0d6"/>
      <stop offset="100%" stop-color="#d9d0c2"/>
    </linearGradient>
    <linearGradient id="desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b7a6a"/>
      <stop offset="100%" stop-color="#6b5d4f"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="750" fill="url(#studio-bg)"/>
  <!-- Wall panel lines -->
  <g stroke="#cdc4b5" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="600" y2="0"/><line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/><line x1="0" y1="300" x2="600" y2="300"/>
  </g>
  <!-- Recording desk -->
  <rect x="50" y="420" width="500" height="120" rx="8" fill="url(#desk)"/>
  <!-- Audio interface / equipment -->
  <rect x="280" y="430" width="200" height="90" rx="3" fill="#2a2a3a"/>
  <g fill="#4a4a5a">
    <rect x="290" y="440" width="30" height="20" rx="2"/>
    <rect x="330" y="440" width="30" height="20" rx="2"/>
    <rect x="370" y="440" width="30" height="20" rx="2"/>
  </g>
  <!-- Knobs -->
  <g fill="#888">
    <circle cx="300" cy="480" r="6"/><circle cx="330" cy="480" r="6"/>
    <circle cx="360" cy="480" r="6"/><circle cx="390" cy="480" r="6"/>
  </g>
  <!-- Computer screen -->
  <rect x="80" y="430" width="160" height="100" rx="4" fill="#1a1a2e"/>
  <rect x="85" y="435" width="150" height="90" rx="2" fill="#2d4a6b"/>
  <!-- Waveform on screen -->
  <path d="M 90,460 Q 110,440 130,465 Q 150,445 170,460 Q 190,440 210,455 Q 225,445 230,460" stroke="#5ae0a0" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Studio monitors -->
  <rect x="20" y="340" width="50" height="70" rx="3" fill="#1a1a2e"/>
  <rect x="530" y="340" width="50" height="70" rx="3" fill="#1a1a2e"/>
  <circle cx="45" cy="375" r="15" fill="#2a2a3e"/>
  <circle cx="555" cy="375" r="15" fill="#2a2a3e"/>
  <!-- Figure (Nazmoon) sitting -->
  <g transform="translate(300, 300)">
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="35" ry="70" fill="#3a2a4a"/>
    <!-- Head -->
    <circle cx="0" cy="-30" r="28" fill="#b8956a"/>
    <!-- Hair -->
    <path d="M -30,-50 Q -20,-70 0,-75 Q 20,-70 30,-50" fill="#1a1a2e"/>
    <path d="M -28,-45 Q -10,-65 5,-70 Q 15,-60 25,-45" fill="#2a1a2e" opacity="0.6"/>
    <!-- Eyes -->
    <ellipse cx="-8" cy="-28" rx="3" ry="2" fill="#2a1a3a"/>
    <ellipse cx="8" cy="-28" rx="3" ry="2" fill="#2a1a3a"/>
    <!-- Smile -->
    <path d="M -6,-20 Q 0,-18 6,-20" stroke="#8b6a5a" stroke-width="1.5" fill="none"/>
    <!-- Headphones -->
    <path d="M -22,-50 Q -28,-60 -15,-65 Q 0,-68 15,-65 Q 22,-60 28,-50" stroke="#333" stroke-width="4" fill="none"/>
    <ellipse cx="-20" cy="-48" rx="10" ry="12" fill="#2a2a3e"/>
    <ellipse cx="20" cy="-48" rx="10" ry="12" fill="#2a2a3e"/>
    <!-- Arms -->
    <path d="M -30,20 Q -20,50 -10,60" stroke="#b8956a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 30,20 Q 20,50 15,60" stroke="#b8956a" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Text label -->
  <text x="300" y="730" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5">Nazmoon — About Image (placeholder)</text>
</svg>